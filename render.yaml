services:
  - type: web
    name: gocelerate-backend
    env: docker
    plan: free
    branch: main
    rootDir: gocelerate
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPRING_JPA_DDL_AUTO
        value: update
