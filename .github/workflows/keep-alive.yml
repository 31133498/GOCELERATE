name: Keep Backend Awake

on:
  schedule:
    # Every 10 minutes. Render's free tier spins down after ~15 minutes of inactivity.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          url="https://gocelerate.onrender.com/api/public/projects"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Backend did not return a healthy status after 5 attempts (last: $status)"
